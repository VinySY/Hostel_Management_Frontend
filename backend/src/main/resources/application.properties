spring.application.name=hostelsync-backend

# ─── Database ─────────────────────────────────────────────────────────────────
# Use environment variables in production; defaults are for local development only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostelsync}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Override JWT_SECRET in production with a long random string (256-bit+).
app.jwt.secret=${JWT_SECRET:HostelSyncSuperSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongAndShouldBeChangedInProduction}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ─── File Upload ──────────────────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_SIZE:52428800}

# Spring multipart limits (50 MB per file, 200 MB total)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.*:*,http://192.168.*:*,http://172.*:*,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://10.200.50.197:3000,http://10.200.50.197:3001,http://10.63.156.120:3000,http://10.63.156.120:3001}

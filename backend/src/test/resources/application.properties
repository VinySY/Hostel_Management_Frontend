spring.application.name=hostelsync-backend-test

# In-memory H2 database in MySQL compatibility mode for unit and context tests
spring.datasource.url=jdbc:h2:mem:hostelsync_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=0

app.jwt.secret=HostelSyncTestSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongAndForTesting
app.jwt.expiration-ms=86400000

app.seeder.enabled=false
app.bootstrap.enabled=false
app.demo.enabled=false
app.demo.seed-enabled=false
app.jobs.enabled=false
app.storage.type=local
app.upload.dir=target/test-uploads
app.upload.max-file-size-bytes=52428800
